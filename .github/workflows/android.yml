name: Android App

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key (repository secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. The APK is signed with a temporary debug key; see docs/ANDROID.zh-TW.md."
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi
      - name: Unit tests, lint and release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace 2>&1 | tee build.log
      - name: Report build errors as annotations
        if: failure()
        run: python3 ../scripts/gradle_errors.py build.log
      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(node -p "require('../package.json').version").${{ github.run_number }}"
          cp app/build/outputs/apk/release/app-release.apk TalkBridge.apk
          NOTE="自動建置自 ${GITHUB_SHA::7}。下載 TalkBridge.apk 安裝；App 內也會提示更新。"
          if [ "$SIGNING" = "debug" ]; then NOTE="$NOTE（暫時簽章：更新前需先解除安裝舊版，詳見 docs/ANDROID.zh-TW.md）"; fi
          gh release create "v$V" TalkBridge.apk --title "TalkBridge $V" --notes "$NOTE" --target "$GITHUB_SHA"
          echo "Published v$V" >> "$GITHUB_STEP_SUMMARY"
