name: Security Scan and Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan repository for secrets and private meeting files
        run: python scripts/security_scan.py .

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm ci || npm install
      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium
      - name: Unit tests
        run: npm test
      - name: Install ffmpeg with flite voices (also checks the thank-you clip)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Browser test (simulated speech, mocked translation and AI providers)
        run: npm run test:e2e
      - name: Automatic speaker separation with real synthetic voices
        run: npm run test:voices
